name: Daily crypto research digest

on:
  workflow_dispatch:
  schedule:
    # 08:00 Asia/Seoul (23:00 UTC on the previous day)
    - cron: "0 23 * * *"

permissions:
  contents: read

concurrency:
  group: crypto-research-digest
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: gpt-5-mini
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      DATABASE_PATH: .state/articles.db
      SOURCES_CONFIG_PATH: config/sources.yaml
      MAX_ARTICLES_PER_RUN: ${{ vars.MAX_ARTICLES_PER_RUN || '5' }}
      RETRY_FAILED_ARTICLES: "false"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Restore processed article history
        uses: actions/cache@v6
        with:
          path: .state
          key: ${{ runner.os }}-article-history-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-article-history-

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest

      - name: Collect, summarize, and publish
        run: python run.py --run-once
